name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    env:
      CAMP_DOMAIN: example.com
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Start game container with compose limits and wait for health
        # compose.yaml의 읽기 전용·권한 제거·메모리/CPU/프로세스 제한과 TRUST_PROXY를 그대로 적용합니다.
        run: docker compose up -d --build --wait --wait-timeout 120 game
      - name: Check pages served from inside the container
        run: |
          docker compose exec -T game wget -q -O /dev/null http://127.0.0.1:3000/healthz
          docker compose exec -T game wget -q -O /dev/null http://127.0.0.1:3000/
          docker compose exec -T game wget -q -O /dev/null http://127.0.0.1:3000/vendor/three/three.module.js
          if docker compose exec -T game wget -q -O /dev/null http://127.0.0.1:3000/design-review.html; then echo "review page must not ship"; exit 1; fi
          test "$(docker compose ps --format '{{.Health}}' game)" = healthy
      - name: Container logs
        if: always()
        run: docker compose logs game || true
